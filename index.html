<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍌</text></svg>">
    <title>Elysian | Premium Media & Talent</title>
    <!-- AdSense Verification Meta Tag -->
    <meta name="google-adsense-account" content="ca-pub-6421372298185696">
    
    <!-- GDPR/ePrivacy Consent script to conditionally load AdSense -->
    <script>
      (function() {
        window.__loadAdSense = function() {
          if (window.__adSenseLoaded) return;
          window.__adSenseLoaded = true;
          var script = document.createElement('script');
          script.async = true;
          script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6421372298185696";
          script.crossOrigin = "anonymous";
          document.head.appendChild(script);
          console.log("[Elysian CMP] AdSense script loaded successfully under consent.");
        };

        try {
          var consent = localStorage.getItem('elysian_cmp_consent');
          if (consent === 'granted' || consent === 'all') {
            window.__loadAdSense();
          }
        } catch (e) {
          console.error("[Elysian CMP] Failed to read consent from localStorage", e);
        }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overscroll-behavior-y: none; /* Prevents pull-to-refresh rubber banding */
        background-color: #000000;
      }
      body {
        font-family: 'Poppins', sans-serif;
        color: #fafafa; /* Zinc 50 */
        -webkit-tap-highlight-color: transparent;
      }
      .font-cursive {
        font-family: 'Satisfy', cursive;
      }
      /* Safe Area Utilities for iOS */
      .safe-area-pb {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .safe-area-pt {
        padding-top: env(safe-area-inset-top);
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; /* Zinc 900 */
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; /* Zinc 700 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #eab308; /* Yellow 500 */
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
</head>
<body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
